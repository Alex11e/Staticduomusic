services:
  hangtar:
    build: .
    container_name: hangtar
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATA_DIR: /data
      MUSIC_DIR: /music
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
    volumes:
      - ./data:/data
      - ./music:/music
    restart: unless-stopped